[project]
name = "ldm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "monai[all]",
    "torch==2.2.0+cu121; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.2.0; sys_platform == 'darwin'",
    "tqdm",
    "monai-generative",
    "lpips>=0.1.4",
    "nibabel>=5.3.2",
    "torchsummary>=1.5.1",
    "mlflow>=3.1.0",
    "pytorch-lightning>=2.5.2",
    "loguru>=0.7.3",
    "itk-elastix>=0.23.0",
    "numpy>=1.26.4",
    "brats>=0.0.20",
    "omegaconf>=2.3.0",
    "psutil>=7.0.0",
    "pynvml>=12.0.0",
    "lightning>=2.5.2",
    "scikit-image>=0.25.2",
    "opencv-python>=4.11.0.86",
    "seaborn>=0.13.2",
    "pie-torch",
    "blobfile>=3.0.0",
    "brainles-preprocessing",
    "antspyx==0.5.3",
    "timm>=1.0.22",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
monai-generative = { git = "https://github.com/Project-MONAI/GenerativeModels.git" }
pie-torch = { git = "https://github.com/matt-baugh/pytorch-poisson-image-editing.git" }


[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
